    <script>
      // Suppress unhandled errors and rejections originating from third-party browser extensions (e.g. MetaMask, web3 wallets)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var message = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          message.indexOf('MetaMask') !== -1 ||
          message.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
          message.indexOf('chrome-extension://') !== -1 ||
          message.indexOf('moz-extension://') !== -1 ||
          message.indexOf('safari-extension://') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function(event) {
        var filename = event.filename || '';
        var message = event.message || '';
        if (
          filename.indexOf('chrome-extension://') !== -1 ||
          filename.indexOf('moz-extension://') !== -1 ||
          filename.indexOf('safari-extension://') !== -1 ||
          filename.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
          message.indexOf('MetaMask') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-100 selection:text-indigo-900">

  </body>
