<!doctype html>
<html lang="en">
  <head>
    <script>
      // Clean runtime error handling: suppress 3rd-party browser extension noise (MetaMask, web3 wallets) and cloud iframe notices
      (function() {
        // 1. Neutralize MetaMask in sandboxed preview iframe so inpage.js does not attempt connection
        try {
          var dummyEthereum = {
            isMetaMask: true,
            _metamask: { isUnlocked: function() { return Promise.resolve(false); } },
            isConnected: function() { return false; },
            request: function() { return Promise.reject(new Error("Preview environment")); },
            sendAsync: function(p, cb) { if (cb) cb(new Error("Preview environment")); },
            send: function(p, cb) { if (cb) cb(new Error("Preview environment")); },
            on: function() {},
            removeListener: function() {},
            autoRefreshOnNetworkChange: false,
          };
          Object.defineProperty(window, 'ethereum', {
            configurable: false,
            enumerable: true,
            get: function() { return dummyEthereum; },
            set: function() {}
          });
        } catch(e) {}

        // 2. Resilient EventTarget-based Mock WebSocket Proxy (prevents Illegal invocation)
        try {
          var OrigWebSocket = window.WebSocket;

          class MockWebSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              var self = this;
              this.url = String(url || '');
              this.protocol = typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols[0] : '');
              this.readyState = 1; // WebSocket.OPEN
              this.bufferedAmount = 0;
              this.extensions = '';
              this.binaryType = 'blob';
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              setTimeout(function() {
                if (self.readyState === 1) {
                  var ev = typeof Event === 'function' ? new Event('open') : { type: 'open' };
                  if (typeof self.onopen === 'function') {
                    try { self.onopen.call(self, ev); } catch(e) {}
                  }
                  self.dispatchEvent(ev);
                }
              }, 0);
            }

            send(data) {}
            close(code, reason) {
              this.readyState = 3; // CLOSED
              var ev = typeof CloseEvent === 'function'
                ? new CloseEvent('close', { code: code || 1000, reason: reason || '', wasClean: true })
                : (typeof Event === 'function' ? new Event('close') : { type: 'close' });
              if (typeof this.onclose === 'function') {
                try { this.onclose.call(this, ev); } catch(e) {}
              }
              this.dispatchEvent(ev);
            }
          }

          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;

          function isViteUrl(url, protocols) {
            var s = String(url || '').toLowerCase();
            var p = String(protocols || '').toLowerCase();
            return (
              s.indexOf('vite') !== -1 ||
              p.indexOf('vite') !== -1 ||
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              s.indexOf('run.app') !== -1 ||
              s.indexOf('localhost') !== -1 ||
              s.indexOf('127.0.0.1') !== -1 ||
              s.indexOf(':3000') !== -1
            );
          }

          if (OrigWebSocket) {
            window.WebSocket = new Proxy(OrigWebSocket, {
              construct: function(target, args) {
                var url = args[0];
                var protocols = args[1];
                if (isViteUrl(url, protocols)) {
                  return new MockWebSocket(url, protocols);
                }
                return Reflect.construct(target, args);
              }
            });
          } else {
            window.WebSocket = MockWebSocket;
          }
        } catch(e) {}

        // 3. Log extraction & filtering helper
        function extractText(arg) {
          if (!arg) return '';
          if (typeof arg === 'string') return arg;
          if (typeof arg === 'symbol') return String(arg);
          if (typeof arg === 'object') {
            try {
              var str = '';
              if (arg.message) str += arg.message + ' ';
              if (arg.stack) str += arg.stack + ' ';
              if (arg.name) str += arg.name + ' ';
              if (arg.code) str += arg.code + ' ';
              if (arg.reason) str += extractText(arg.reason) + ' ';
              if (arg.cause) str += extractText(arg.cause) + ' ';
              try {
                str += JSON.stringify(arg) + ' ';
              } catch (e) {}
              return str || Object.prototype.toString.call(arg);
            } catch (e) {
              return String(arg);
            }
          }
          return String(arg);
        }

        function isIgnored(str) {
          if (!str || typeof str !== 'string') return false;
          var s = str.toLowerCase();
          return (
            s.indexOf('metamask') !== -1 ||
            s.indexOf('inpage.js') !== -1 ||
            s.indexOf('restoring session') !== -1 ||
            s.indexOf('failed to connect to metamask') !== -1 ||
            s.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            s.indexOf('chrome-extension:') !== -1 ||
            s.indexOf('moz-extension:') !== -1 ||
            s.indexOf('safari-extension:') !== -1 ||
            s.indexOf('websocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('websocket') !== -1 ||
            s.indexOf('illegal invocation') !== -1 ||
            s.indexOf('[vite] connecting') !== -1 ||
            s.indexOf('[vite]') !== -1
          );
        }

        function checkArgs(args) {
          if (!args) return false;
          var combined = '';
          for (var i = 0; i < args.length; i++) {
            combined += extractText(args[i]) + ' ';
          }
          return isIgnored(combined);
        }

        // 4. Console wrapper with intercepting setter to stop parent notification
        var methods = ['warn', 'error', 'info', 'debug', 'log'];
        for (var i = 0; i < methods.length; i++) {
          (function(m) {
            var nativeMethod = console[m] || function() {};
            var activeHandler = function() {
              if (checkArgs(arguments)) {
                return;
              }
              return nativeMethod.apply(console, arguments);
            };

            try {
              Object.defineProperty(console, m, {
                configurable: true,
                enumerable: true,
                get: function() {
                  return activeHandler;
                },
                set: function(newFn) {
                  if (newFn === activeHandler) return;
                  activeHandler = function() {
                    if (checkArgs(arguments)) {
                      return; // Drop before subsequent interceptor (like _aistudio-iframe.js) can forward to UI
                    }
                    return newFn.apply(console, arguments);
                  };
                }
              });
            } catch (e) {
              console[m] = activeHandler;
            }
          })(methods[i]);
        }

        // 5. Intercept unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          var text = extractText(event.reason);
          if (isIgnored(text)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 6. Intercept window error events
        window.addEventListener('error', function(event) {
          var text = (event.message || '') + ' ' + (event.filename || '') + ' ' + extractText(event.error);
          if (isIgnored(text)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
