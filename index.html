<!doctype html>
<html lang="en">
  <head>
    <script>
      // Clean runtime error handling: suppress 3rd-party extension noise (MetaMask) and expected Vite dev websocket notices
      (function() {
        function extractText(arg) {
          if (!arg) return '';
          if (typeof arg === 'string') return arg;
          if (typeof arg === 'object') {
            try {
              var str = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + (arg.name || '');
              if (arg.cause) str += ' ' + extractText(arg.cause);
              return str;
            } catch (e) {
              return String(arg);
            }
          }
          return String(arg);
        }

        function isIgnored(str) {
          if (!str || typeof str !== 'string') return false;
          var s = str.toLowerCase();
          return (
            s.indexOf('metamask') !== -1 ||
            s.indexOf('inpage.js') !== -1 ||
            s.indexOf('restoring session') !== -1 ||
            s.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            s.indexOf('chrome-extension:') !== -1 ||
            s.indexOf('moz-extension:') !== -1 ||
            s.indexOf('safari-extension:') !== -1 ||
            s.indexOf('websocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('websocket') !== -1 ||
            s.indexOf('illegal invocation') !== -1 ||
            s.indexOf('[vite]') !== -1
          );
        }

        function checkArgs(args) {
          var combined = '';
          for (var i = 0; i < args.length; i++) {
            combined += extractText(args[i]) + ' ';
          }
          return isIgnored(combined);
        }

        // Filter console methods
        var origWarn = console.warn;
        console.warn = function() {
          if (checkArgs(arguments)) return;
          origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function() {
          if (checkArgs(arguments)) return;
          origError.apply(console, arguments);
        };

        var origDebug = console.debug;
        console.debug = function() {
          if (checkArgs(arguments)) return;
          origDebug.apply(console, arguments);
        };

        var origInfo = console.info;
        console.info = function() {
          if (checkArgs(arguments)) return;
          origInfo.apply(console, arguments);
        };

        // Filter messages relayed by parent iframe loggers to AI Studio console
        try {
          if (window.parent && window.parent !== window) {
            var origParentPost = window.parent.postMessage;
            window.parent.postMessage = function(msg, targetOrigin, transfer) {
              var serialized = '';
              try {
                serialized = typeof msg === 'string' ? msg : JSON.stringify(msg);
              } catch (e) {
                serialized = String(msg);
              }
              if (isIgnored(serialized)) return;
              return origParentPost.apply(window.parent, arguments);
            };
          }
          if (window.top && window.top !== window && window.top !== window.parent) {
            var origTopPost = window.top.postMessage;
            window.top.postMessage = function(msg, targetOrigin, transfer) {
              var serialized = '';
              try {
                serialized = typeof msg === 'string' ? msg : JSON.stringify(msg);
              } catch (e) {
                serialized = String(msg);
              }
              if (isIgnored(serialized)) return;
              return origTopPost.apply(window.top, arguments);
            };
          }
        } catch (e) {}

        // Suppress unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          var text = extractText(event.reason);
          if (isIgnored(text)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Suppress window error events
        window.addEventListener('error', function(event) {
          var text = (event.message || '') + ' ' + (event.filename || '') + ' ' + extractText(event.error);
          if (isIgnored(text)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
